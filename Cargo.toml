[workspace]
resolver = "2"
members = [
    "crates/prok-core",
    "crates/prok-cli",
    "crates/prok-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/prokoptas/prokoptas"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
